services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-realtime:
    image: redis:7-alpine
    # noeviction protects durable-ish volatile state (dirty sets, presence,
    # locks) from silent eviction under memory pressure (P2b.1).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_realtime_data:/data
    ports:
      - "6379:6379"

  redis-jobs:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_jobs_data:/data
    ports:
      - "6380:6379"

  adminer:
    image: adminer:5
    restart: unless-stopped
    profiles: ["debug"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    profiles: ["debug"]
    depends_on:
      redis-realtime:
        condition: service_started
      redis-jobs:
        condition: service_started
    environment:
      REDIS_HOSTS: "realtime:redis-realtime:6379:0,jobs:redis-jobs:6379:0"
    ports:
      - "8082:8081"

  backend-dev:
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /app
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_REALTIME_URL: redis://redis-realtime:6379
      REDIS_JOBS_URL: redis://redis-jobs:6379
      EVENT_BUS_TRANSPORT: bullmq
      PORT: "8080"
      REALTIME_PORT: "8081"
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173,http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "250"
    depends_on:
      postgres:
        condition: service_healthy
      redis-realtime:
        condition: service_started
      redis-jobs:
        condition: service_started
    volumes:
      - .:/app
      - backend_dev_node_modules:/app/node_modules
    # No published ports: the dev-proxy is the single origin (:8080),
    # mirroring production nginx path-splitting. Reach apps directly via
    # `docker compose exec` if ever needed.
    stdin_open: true
    tty: true
    # Run all three apps: with the split, api-only dev would silently lose
    # Socket.IO and preview generation. Migration must finish before any
    # app starts; the braces keep the three watchers in one foreground wait.
    command: >
      sh -lc "npm ci && npm run db:migrate &&
              { npm run dev & npm run dev:realtime & npm run dev:worker & wait; }"

  dev-proxy:
    image: nginx:1.27-alpine
    profiles: ["dev"]
    restart: unless-stopped
    depends_on:
      - backend-dev
    ports:
      - "8080:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_REALTIME_URL: redis://redis-realtime:6379
      REDIS_JOBS_URL: redis://redis-jobs:6379
      EVENT_BUS_TRANSPORT: bullmq
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis-realtime:
        condition: service_started
      redis-jobs:
        condition: service_started

  realtime:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: realtime
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_REALTIME_URL: redis://redis-realtime:6379
      REDIS_JOBS_URL: redis://redis-jobs:6379
      EVENT_BUS_TRANSPORT: bullmq
      PORT: "3001"
      REALTIME_PORT: "3001"
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis-realtime:
        condition: service_started
      redis-jobs:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: worker
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_REALTIME_URL: redis://redis-realtime:6379
      REDIS_JOBS_URL: redis://redis-jobs:6379
      EVENT_BUS_TRANSPORT: bullmq
    # No HTTP surface: no healthcheck, nothing to expose.
    depends_on:
      postgres:
        condition: service_healthy
      redis-realtime:
        condition: service_started
      redis-jobs:
        condition: service_started

  migrator:
    image: node:22-alpine
    working_dir: /app
    profiles: ["tools"]
    volumes:
      - .:/app
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -lc "npm ci --include=dev && npm run db:migrate"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - api
      - realtime
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    command: >
      /bin/sh -eu -c '
      if [ -f "/etc/letsencrypt/live/$${API_DOMAIN}/fullchain.pem" ] && [ -f "/etc/letsencrypt/live/$${API_DOMAIN}/privkey.pem" ]; then
        sed "s/__API_DOMAIN__/$${API_DOMAIN}/g" /etc/nginx/templates/https.conf.template > /etc/nginx/conf.d/default.conf;
      else
        sed "s/__API_DOMAIN__/$${API_DOMAIN}/g" /etc/nginx/templates/http.conf.template > /etc/nginx/conf.d/default.conf;
      fi;
      nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
  redis_realtime_data:
  redis_jobs_data:
  backend_dev_node_modules:
  certbot_www:
  letsencrypt:
