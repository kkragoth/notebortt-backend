# Dev reverse proxy: single origin for REST + WebSocket, mirroring the
# production nginx topology (/ -> api app, /socket.io/ -> realtime app).
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 10m;

    location /socket.io/ {
        set $realtime_upstream http://backend-dev:8081;
        proxy_pass $realtime_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;
    }

    location / {
        set $api_upstream http://backend-dev:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
