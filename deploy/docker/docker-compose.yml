services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: notecanva
      POSTGRES_USER: notecanva
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U notecanva
      interval: 5s
      timeout: 3s
      retries: 5

  redis-realtime:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 5

  redis-jobs:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:5
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - debug

  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: realtime:redis-realtime:6379,jobs:redis-jobs:6379
    depends_on:
      redis-realtime:
        condition: service_healthy
      redis-jobs:
        condition: service_healthy
    profiles:
      - debug

  backend-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "8080:8080"
    volumes:
      - ../..:/app
      - backend-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis-realtime:
        condition: service_healthy
      redis-jobs:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://notecanva:localdev@postgres:5432/notecanva
      REDIS_REALTIME_URL: redis://redis-realtime:6379
      REDIS_JOBS_URL: redis://redis-jobs:6379
      PORT: "8080"
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007,http://localhost:3008,http://localhost:3009,http://localhost:3010
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8080/auth/callback
      JWT_SECRET: dev-jwt-secret-change-in-production-min16chars
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_DAYS: "7"
    profiles:
      - dev

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis-realtime:
        condition: service_healthy
      redis-jobs:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://notecanva:localdev@postgres:5432/notecanva
      REDIS_REALTIME_URL: redis://redis-realtime:6379
      REDIS_JOBS_URL: redis://redis-jobs:6379
      PORT: "8080"
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007,http://localhost:3008,http://localhost:3009,http://localhost:3010
    profiles:
      - full

volumes:
  pgdata:
  backend-node-modules:
