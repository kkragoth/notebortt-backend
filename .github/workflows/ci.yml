name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notecanva
          POSTGRES_PASSWORD: notecanva
          POSTGRES_DB: notecanva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notecanva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://notecanva:notecanva@localhost:5432/notecanva
      REDIS_URL: redis://localhost:6379
      REDIS_REALTIME_URL: redis://localhost:6379
      REDIS_JOBS_URL: redis://localhost:6379
      NODE_ENV: test
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      GOOGLE_REDIRECT_URI: http://localhost:3000/auth/callback
      JWT_SECRET: ci-secret-ci-secret-ci-secret
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src test

      - name: Build
        run: npm run build

      - name: Apply database schema
        run: npx drizzle-kit migrate

      - name: Test
        run: npx vitest run

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f docker-compose.yml config -q

      # Catches Dockerfile regressions (broken CMD/ARG wiring, missing
      # dist entrypoints) that vitest cannot see.
      - name: Build app images
        run: |
          docker build --build-arg APP=api -t nc-api .
          docker build --build-arg APP=realtime -t nc-realtime .
          docker build --build-arg APP=worker -t nc-worker .
